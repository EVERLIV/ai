name: Deploy

# Автодеплой после push в main: собираем сайт и обновляем edge-функцию.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Сборка сайта
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Проверка типов и тесты
        run: |
          npx tsc --noEmit
          npm test

      - name: Сборка (sitemap, RSS, dist)
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: npm run build

      # Готовый сайт можно скачать из вкладки Actions и выложить на сервер.
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 14

  functions:
    name: Деплой edge-функции
    runs-on: ubuntu-latest
    needs: build
    # Пропускаем, если не заданы секреты SUPABASE_ACCESS_TOKEN и SUPABASE_PROJECT_REF.
    if: ${{ vars.DEPLOY_FUNCTIONS == 'true' }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: supabase functions deploy ai-chat ai-listing-create notify-lead telegram-bot notify-property-email send-agency-invite
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy ai-chat \
            --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" \
            --no-verify-jwt
          supabase functions deploy ai-listing-create \
            --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" \
            --no-verify-jwt
          supabase functions deploy notify-lead \
            --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" \
            --no-verify-jwt
          supabase functions deploy telegram-bot \
            --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" \
            --no-verify-jwt
          supabase functions deploy notify-property-email \
            --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" \
            --no-verify-jwt
          supabase functions deploy send-agency-invite \
            --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" \
            --no-verify-jwt
