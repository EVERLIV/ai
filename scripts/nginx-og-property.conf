# Фрагмент для nginx на arendacity.com — Open Graph для карточек объектов.
# Боты Telegram/VK/WhatsApp получают статический HTML из /og/property/{id}.html
# Страницы генерируются при сборке: npm run build (scripts/generate-seo.mjs)

location ~ ^/property/([0-9a-f-]+)$ {
    set $property_id $1;

    if ($http_user_agent ~* "(facebookexternalhit|Facebot|TelegramBot|Twitterbot|WhatsApp|vkShare|LinkedInBot|Slackbot|Discordbot|embedly|Pinterest|bot|crawler|spider)") {
        rewrite ^ /og/property/$property_id.html last;
    }

    try_files $uri /index.html;
}

location ^~ /og/property/ {
    try_files $uri =404;
}
