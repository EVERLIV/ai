# Фрагмент для nginx на arendacity.com — статический HTML для карточек объектов.
# Поисковики и соцботы получают rich HTML из /og/property/{id}.html (generate-seo.mjs).
# НЕ используйте общий паттерн bot|crawler|spider — он ловит Googlebot и отдаёт
# тонкую страницу с meta-refresh → «Crawled – currently not indexed».
#
# Подключайте location-блоки в server {}; map не нужен.

location ~ ^/property/([0-9a-f-]+)$ {
    set $property_id $1;

    if ($http_user_agent ~* "(facebookexternalhit|Facebot|TelegramBot|Twitterbot|WhatsApp|vkShare|LinkedInBot|Slackbot|Discordbot|embedly|Pinterest|Googlebot|Google-InspectionTool|bingbot|BingPreview|YandexBot|YandexImages|YandexWebmaster|DuckDuckBot|Applebot)") {
        rewrite ^ /og/property/$property_id.html last;
    }

    try_files $uri /index.html;
}

location ^~ /og/property/ {
    try_files $uri =404;
}
