server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml text/xml;

    # Статический HTML карточек (generate-seo.mjs) — без SPA-fallback.
    location ^~ /og/property/ {
        default_type text/html;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600";
    }

    # Роботы/соцсети → rich HTML; люди → SPA.
    # Не используйте общий bot|crawler|spider — ломает индексацию Google/Яндекс.
    location ~ ^/property/([0-9a-fA-F-]{36})$ {
        set $property_id $1;

        if ($http_user_agent ~* "(facebookexternalhit|Facebot|TelegramBot|Twitterbot|WhatsApp|vkShare|LinkedInBot|Slackbot|Discordbot|embedly|Pinterest|Googlebot|Google-InspectionTool|bingbot|BingPreview|YandexBot|YandexImages|YandexWebmaster|DuckDuckBot|Applebot)") {
            rewrite ^ /og/property/$property_id.html last;
        }

        try_files $uri /index.html;
    }

    # sitemap / robots / feed — всегда файлы из dist
    location = /sitemap.xml {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=900";
    }
    location = /robots.txt {
        try_files $uri =404;
    }
    location = /feed.xml {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=900";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
