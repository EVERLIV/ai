server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Same OG crawler rewrite as scripts/nginx-og-property.conf:
    # Telegram/VK/WhatsApp get static HTML generated at build time.
    location ~ ^/property/([0-9a-f-]+)$ {
        set $property_id $1;

        if ($http_user_agent ~* "(facebookexternalhit|Facebot|TelegramBot|Twitterbot|WhatsApp|vkShare|LinkedInBot|Slackbot|Discordbot|embedly|Pinterest|bot|crawler|spider)") {
            rewrite ^ /og/property/$property_id.html last;
        }

        try_files $uri /index.html;
    }

    location ^~ /og/property/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
